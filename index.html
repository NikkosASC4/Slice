<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slice — Spending Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Slice</h1>
    <p>your buckets</p>
  </header>

  <!-- Safe to spend (primary view) -->
  <section class="spend-hero">
    <div class="spend-toggle" id="spend-toggle">
      <button class="spend-toggle-btn active" data-range="today" type="button">Today</button>
      <button class="spend-toggle-btn" data-range="week" type="button">This week</button>
    </div>
    <div class="spend-amt" id="spend-amt">$0.00</div>
    <div class="spend-sub" id="spend-sub">safe to spend</div>
    <button class="text-btn breakdown-toggle" id="breakdown-toggle" type="button">Show full breakdown ▾</button>
  </section>

  <!-- Overview (secondary / opt-in breakdown) -->
  <section class="chart-section" id="chart-section">
    <div class="chart-wrap">
      <div class="no-budget-msg" id="no-budget-msg">
        <span>Add a bucket to get started.</span>
      </div>
      <canvas id="pie" style="display:none"></canvas>
      <div class="chart-center" id="chart-center" style="display:none">
        <span class="total-label">Remaining</span>
        <span class="total-amt" id="total-amt"></span>
        <span class="budget-of" id="budget-of"></span>
      </div>
    </div>
  </section>

  <!-- Buckets -->
  <section class="buckets-section">
    <div class="buckets-header">
      <h2>Buckets</h2>
      <div class="buckets-header-actions">
        <button class="text-btn" id="reset-all-btn">Reset all</button>
        <button class="text-btn accent" id="add-bucket-btn">+ New</button>
      </div>
    </div>
    <div id="buckets-list"></div>
  </section>

  <!-- Bucket add/edit modal -->
  <div class="modal-overlay" id="bucket-modal-overlay">
    <div class="modal">
      <h3 id="bucket-modal-title">New bucket</h3>
      <div>
        <label>Name</label>
        <input type="text" id="bucket-name-input" placeholder="Groceries" maxlength="24">
      </div>
      <div>
        <label>Amount ($)</label>
        <input type="number" id="bucket-amount-input" placeholder="350.00" min="0" step="0.01">
      </div>
      <div>
        <label>Resets</label>
        <select id="bucket-cadence-input">
          <option value="weekly">Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="asneeded">As needed</option>
        </select>
      </div>
      <button class="modal-btn" id="save-bucket-btn">Save bucket</button>
      <button class="modal-btn-secondary danger" id="delete-bucket-btn" style="display:none">Delete bucket</button>
    </div>
  </div>

  <!-- Pull (log spend) modal -->
  <div class="modal-overlay" id="pull-modal-overlay">
    <div class="modal">
      <h3 id="pull-modal-title">Pull from Groceries</h3>
      <div>
        <label>Amount ($)</label>
        <input type="number" id="pull-amount-input" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      </div>
      <div>
        <label>Note (optional)</label>
        <input type="text" id="pull-note-input" placeholder="Wegmans run" maxlength="40">
      </div>
      <button class="modal-btn" id="save-pull-btn">Log it</button>
    </div>
  </div>

  <!-- Confirm dialog (in-app replacement for window.confirm, which the artifact sandbox blocks) -->
  <div class="modal-overlay" id="confirm-modal-overlay">
    <div class="modal">
      <h3 id="confirm-modal-title">Are you sure?</h3>
      <p id="confirm-modal-msg" class="confirm-msg"></p>
      <button class="modal-btn" id="confirm-modal-ok">Confirm</button>
      <button class="modal-btn-secondary" id="confirm-modal-cancel">Cancel</button>
    </div>
  </div>

  <!-- Recent activity -->
  <section class="entries-section">
    <div class="entries-header">
      <h2>Recent activity</h2>
      <button class="clear-btn" id="clear-btn">Clear history</button>
    </div>
    <div id="entries-list"></div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
