<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slice — Spending Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Slice</h1>
    <p>spending tracker</p>
  </header>

  <div class="period-tabs" id="period-tabs">
    <button class="active" data-period="daily">Daily</button>
    <button data-period="weekly">Weekly</button>
    <button data-period="monthly">Monthly</button>
  </div>

  <!-- Budget bar -->
  <div class="budget-bar">
    <div class="budget-row">
      <span class="budget-label">Budget</span>
      <button class="budget-edit-btn" id="budget-edit-btn">Edit</button>
    </div>
    <div class="budget-amounts">
      <div>
        <span class="budget-spent" id="spent-display">$0.00</span>
        <span class="budget-sub">spent</span>
      </div>
      <div style="text-align:right">
        <span class="budget-remaining" id="remaining-display">—</span>
        <span class="budget-sub" id="remaining-label">set a budget</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Budget modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Set budget</h3>
      <div>
        <label>Amount ($)</label>
        <input type="number" id="budget-input" placeholder="500.00" min="0" step="0.01">
      </div>
      <button class="modal-btn" id="save-budget-btn">Save budget</button>
    </div>
  </div>

  <!-- Chart -->
  <section class="chart-section">
    <div class="chart-wrap">
      <div class="no-budget-msg" id="no-budget-msg">
        <span>Set a budget to get started.</span>
      </div>
      <canvas id="pie" style="display:none"></canvas>
      <div class="chart-center" id="chart-center" style="display:none">
        <span class="total-label" id="period-label">Today</span>
        <span class="total-amt" id="total-amt"></span>
        <span class="budget-of" id="budget-of"></span>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- Add expense -->
  <section class="add-section">
    <h2>Add expense</h2>
    <div class="input-row">
      <div class="input-group">
        <label>Amount ($)</label>
        <input type="number" id="amount-input" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="input-group">
        <label>Category</label>
        <select id="cat-input">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <button class="add-btn" id="add-btn">+ Add</button>
  </section>

  <!-- Entries list -->
  <section class="entries-section">
    <div class="entries-header">
      <h2 id="entries-heading">Today's entries</h2>
      <button class="clear-btn" id="clear-btn">Clear all</button>
    </div>
    <div id="entries-list"></div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
